- name: Debug resolved inventory
  hosts: new_vm
  gather_facts: false
  tasks:
    - debug:
        msg:
          inventory_hostname: "{{ inventory_hostname }}"
          ansible_host: "{{ ansible_host }}"
          ansible_user: "{{ ansible_user }}"  
  
  
  roles:
    - node_exporter


