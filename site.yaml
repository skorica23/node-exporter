- name: Install monitoring agents
  hosts: new_vm
  gather_facts: false
  become: true
  connection: ssh  # FORCE SSH CONNECTION
  become: true
  become_method: sudo
  vars:
    ansible_connection: ssh  # ALSO SET AS VAR
    ansible_shell_executable: /bin/bash
    ansible_become_exe: /usr/bin/sudo
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    
    - name: Ensure Python3 and pip are installed
      ansible.builtin.raw: apt install -y python3 python3-pip curl
      changed_when: false
    
    - name: Update Python packages
      ansible.builtin.raw: pip3 install --upgrade urllib3 requests
      changed_when: false
      ignore_errors: true

    - name: Debug connection type
      ansible.builtin.debug:
        msg: 
          - "Connection: {{ ansible_connection }}"
          - "Host: {{ ansible_host }}"
          - "User: {{ ansible_user }}"
    
    - name: Test raw command without become
      ansible.builtin.raw: echo "Connected as $(whoami) from $(hostname)"
      register: raw_test
      changed_when: false
      
    - name: Show raw test
      ansible.builtin.debug:
        msg: "{{ raw_test.stdout }}"
    
    - name: Test sudo with full path via raw
      ansible.builtin.raw: /usr/bin/sudo whoami
      register: sudo_raw
      changed_when: false
      
    - name: Show sudo raw test
      ansible.builtin.debug:
        msg: "{{ sudo_raw.stdout }}"

    - name: Print registered hosts
      ansible.builtin.debug:
        var: hostvars[inventory_hostname]
      when: inventory_hostname in groups['new_vm']
      ignore_errors: true
    
    - name: Print PATH variable
      ansible.builtin.command: echo $PATH
      register: path_output
      ignore_errors: true

    - name: Show PATH variable
      ansible.builtin.debug:
        msg: "Current PATH: {{ path_output.stdout }}"
      ignore_errors: true
    
    - name: Show PATH variable
      ansible.builtin.debug:
        msg: "Current PATH: {{ path_output.stdout | default('not accessible') }}"
      ignore_errors: true
    
    - name: Test - verify we can become root
      ansible.builtin.raw: /usr/bin/sudo whoami
      register: sudo_test
      ignore_errors: true
              
    - name: Show sudo test result
      ansible.builtin.debug:
        msg: "Sudo test: {{ sudo_test.stdout }}"
      ignore_errors: true

    - name: Check if sudo exists
      ansible.builtin.command: which sudo
      register: sudo_check
      ignore_errors: true

    - name: Show sudo existence check
      ansible.builtin.debug:
        msg: "Sudo is located at: {{ sudo_check.stdout }}"
      ignore_errors: true


    - name: Verify we can become root
      ansible.builtin.shell: /usr/bin/sudo whoami
      register: sudo_test
      ignore_errors: true
    
    - name: Show sudo test result
      ansible.builtin.debug:
        msg: "Sudo test: {{ sudo_test.stdout }}"
      ignore_errors: true

  
  roles:
    - node_exporter
    - otel_collector


