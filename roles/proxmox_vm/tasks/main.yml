---

# - name: Gather VM info
#   community.proxmox.proxmox_vm_info:
#     node: "{{ proxmox_node }}"
#   register: proxmox_vms

# - name: Check kvm output
#   community.proxmox.proxmox_kvm:
#   register: proxmox_vms

- name: Debug proxmox_vm_info output
  ansible.builtin.debug:
    var: proxmox_vms

# - name: Check kvm output
#   community.proxmox.proxmox_kvm:
- name: Get list of VMs on node
  community.proxmox.proxmox_vm_info:
    node: "{{ proxmox_node }}"
  register: proxmox_vms

- name: Set VM existence fact
  ansible.builtin.set_fact:
    existing_vm:: "{{ proxmox_vms.proxmox_vms | selectattr('name', 'equalto', vm_name ) | list }}"


- name: Set vm_exists and vmid if present
  set_fact:
    vm_exists: "{{ existing_vm | length > 0 }}"
    vmid: "{{ existing_vm[0].vmid | default(omit) }}"


- name: Check if VM already exists
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    vmid: "{{ vmid }}"
    state: current
  # register: vm_check
  # failed_when: false
  # changed_when: false

- name: Set vm_exists fact
  set_fact:
    vm_exists: "{{ not vm_check.failed }}"

- name: Debug clone inputs
  debug:
    msg:
      proxmox_node: "{{ proxmox_node }}"
      template_name: "{{ template_name }}"
      vm_name: "{{ vm_name }}"
      storage: "{{ storage }}"
      vm_ip: "{{ vm_ip }}"
      vm_cidr: "{{ vm_cidr }}"
      vm_gateway: "{{ vm_gateway }}"
      vm_exists: "{{ vm_exists }}"

- name: Clone VM from template (static IP)
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    clone: "{{ template_id }}"
    #vmid: "{{ vmid }}"
    name: "{{ vm_name }}"
    full: true
    storage: "{{ storage }}"
    ipconfig:
      ipconfig0: "ip={{ vm_ip }}/{{ vm_cidr }},gw={{ vm_gateway }}"
   # nameservers: "{{ vm_dns }}"
  when: not vm_exists
  register: clone_result
  
- name: Set vmid from clone result
  set_fact:
    vmid: "{{ clone_result.vmid }}"
  when: not vm_exists

  
- name: Debug proxmox_vm_info output
  debug:
    var: clone_result

- name: Apply cloud-init config
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    name: "{{ vm_name }}"
    update: true

- name: Ensure VM is started
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    vmid: "{{ vmid }}"
    state: started

- name: Wait for SSH to become available
  ansible.builtin.wait_for:
    host: "{{ vm_ip }}"
    port: 22
    timeout: 300


- name: Debug registration values
  ansible.builtin.debug:
    msg: |
      Registering new VM with the following details:
      - VM Name: "{{ vm_name }}"
      - VM IP: "{{ vm_ip }}"
      - Ansible User: "{{ ansible_user }}"
      - Ansible Shell Executable: "{{ ansible_shell_executable }}"

- name: Register VM for next play
  ansible.builtin.add_host:
    name: "{{ vm_name }}"
    groups: new_vm
    ansible_host: "{{ vm_ip }}"
    ansible_user: test_1
    #ansible_shell_executable: /bin/bash  # <-- ADD THIS
    ansible_user: test_1
    ansible_shell_executable: /bin/bash  # <-- ADD THIS