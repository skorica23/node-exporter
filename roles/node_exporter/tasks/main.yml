---
- name: Debug sudo privileges
  hosts: new_vm
  gather_facts: false
  tasks:
    - name: Check current user (no sudo)
      ansible.builtin.command: whoami
      register: current_user
      
    - name: Check effective user with become
      ansible.builtin.command: whoami
      become: true
      become_method: sudo
      register: sudo_user
      ignore_errors: true
      
    - name: Test sudo directly
      ansible.builtin.shell: sudo whoami
      register: sudo_test
      ignore_errors: true

    - name: Display results
      ansible.builtin.debug:
        msg:
          - "Current user: {{ current_user.stdout }}"
          - "User with become: {{ sudo_user.stdout }}"
          - "Direct sudo: {{ sudo_test.stdout }}"
          - "Ansible become: {{ ansible_become }}"
          - "Ansible become method: {{ ansible_become_method }}"
      ignore_errors: true


- name: Run a command
  ansible.builtin.command: whoami
  register: whoami_result

- debug:
    msg: "Ansible is running as user: {{ whoami_result.stdout }}"
    #ssh_user: "{{ ansible_user }}"
    #effective_user: "{{ ansible_effective_user_id | default('unknown') }}"

# node_exporter/tasks/main.yml
- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  # become: true
  # become_method: sudo
  # become_user: root
  # become_flags: '-H -S -n'



