---
- name: Run a command
  ansible.builtin.command: whoami
  register: whoami_result

- debug:
    msg: "Ansible is running as user: {{ whoami_result.stdout }}"
    #ssh_user: "{{ ansible_user }}"
    #effective_user: "{{ ansible_effective_user_id | default('unknown') }}"

# node_exporter/tasks/main.yml
- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  # become: true
  # become_method: sudo
  # become_user: root
  # become_flags: '-H -S -n'


- name: Download node_exporter tarball using curl (bypass Python issue)
  ansible.builtin.command:
    cmd: >
      curl -L -o /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    creates: /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

- name: Create extraction directory
  ansible.builtin.file:
    path: /tmp/node_exporter-{{ node_exporter_version }}
    state: directory
    mode: '0755'

- name: Extract node_exporter tarball
  ansible.builtin.unarchive:
    src: /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
    dest: /tmp/node_exporter-{{ node_exporter_version }}
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Copy node_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/node_exporter-{{ node_exporter_version }}/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: '0755'
    remote_src: true

- name: Create systemd service file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: restart node_exporter

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Cleanup temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
    - /tmp/node_exporter-{{ node_exporter_version }}





